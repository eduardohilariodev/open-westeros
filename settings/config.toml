[general]
host = "::"
port = 8080
root = "/public"
log-level = "error"
cache-control-headers = true
compression = true
compression-static = true
directory-listing = false
redirect-trailing-slash = true

[advanced]

# Hashed Vite output: never changes under the same name.
[[advanced.headers]]
source = "/assets/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Big map data and textures: keep a month at the browser and the CDN.
[[advanced.headers]]
source = "/{world,world-test,sites,textures,towns,sigils,coin,fonts}/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=2592000"

# Entry point and service worker: revalidate quickly.
[[advanced.headers]]
source = "/{index.html,sw.js}"
[advanced.headers.headers]
Cache-Control = "public, max-age=60, must-revalidate"
