# Cache rules for the live server. Wasmer's autobuild serves dist/ with static-web-server from /opt/static_app, and the app's
# SERVER_CONFIG_FILE env var points here (/opt/static_app/sws.toml). Without it, HTML is cached for a day: a stale index.html then
# asks for /assets/ files a newer deploy removed and the page loads blank (findings 2026-11-11). Only headers here: the server's
# root, port and the rest stay as the autobuild sets them.
[advanced]

# Security headers on every response. The CSP lists every outside origin the site uses: PostHog (analytics, and its session
# recorder script from us-assets.i.posthog.com) and A Wiki of Ice and Fire (hot-linked pictures, also fetched by sw.js).
# 'wasm-unsafe-eval': Winterfell's meshopt decoder is WebAssembly. No inline script anywhere (index.html loads public/loading.js);
# inline styles are allowed because the UI sets style attributes. A new outside host must be added here or it is blocked.
[[advanced.headers]]
source = "/**"
[advanced.headers.headers]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://*.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://awoiaf.westeros.org; font-src 'self' data:; connect-src 'self' https://*.posthog.com https://awoiaf.westeros.org; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Strict-Transport-Security = "max-age=31536000"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Pages and the service worker: always revalidated, so a deploy is seen at once.
[[advanced.headers]]
source = "{/,/index.html,/sw.js,/place/**,/sitemap.xml,/robots.txt,/loading.js}"
[advanced.headers.headers]
Cache-Control = "no-cache"

# Hashed Vite output: never changes under the same name.
[[advanced.headers]]
source = "/assets/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Maps, textures, 3D places, coats of arms, fonts: a month. Their names don't change when a file does; sw.js revalidates them
# whenever public/ changes (its media cache is named after a hash of it), so a returning visitor never keeps a stale one.
[[advanced.headers]]
source = "/{world,sites,textures,towns,sigils,coin,fonts}/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=2592000"
